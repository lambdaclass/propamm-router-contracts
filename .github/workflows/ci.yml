name: CI

on:
  pull_request:
  push:
    branches: [main, contracts/audit/base]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (build / format / tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      # Fork suites are deliberately OFF the PR gate. They read live propAMM
      # state, and most lanes are stale at any given block, so a red X here
      # would mean "the market moved", not "you broke something". They run
      # daily instead -- see fork-tests.yml.
      #
      # Both halves matter: `ForkGate` runs a suite only when RPC_URL is set,
      # so leaving it unset is the primary guard and `--no-match-path` is the
      # backstop for any suite that reaches the network another way.
      - name: Run tests
        run: forge test --no-match-path '*Fork*'

  halmos:
    name: Contracts (Halmos symbolic checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Halmos
        run: uv tool install --python 3.12 halmos==0.3.3

      # The arithmetic half of the no-regret proof. z3-solver comes with Halmos.
      - name: No-regret lemma (Z3)
        run: "$(uv tool dir)/halmos/bin/python test/halmos/no_regret_lemma.py"

      # No-regret: one venue, on both pricing paths (blind probe and
      # IPropAMMFillable); the two-venue check does not finish in 2 hours.
      # Custody: the IPropAMMFillable check only; the blind-probe one takes
      # about an hour and runs locally. See test/halmos/README.md.
      # Non-blocking until runtimes on hosted runners are known (the lemma
      # step above IS blocking). Halmos exits 0 on a run that hit the loop
      # bound, found only unknown counterexamples, or reverted on every path,
      # none of which is a proof, so those warnings fail the step.
      - name: Halmos
        continue-on-error: true
        env:
          FOUNDRY_PROFILE: halmos
        run: |
          set -o pipefail
          halmos --function 'check_(noRegretCertificate_one|custody_oneFillable)' 2>&1 | tee halmos.log
          if grep -E 'warnings#(loop-bound|counterexample-unknown|revert-all|internal-error)' halmos.log; then
            echo "::error::Halmos run is not a complete proof (see warnings above)"
            exit 1
          fi

  # The split planner (sort, waterfall) with up to six candidates, and the
  # execution of a plan with up to three venues. Its own job so it runs in
  # parallel with the router checks above instead of eating into their
  # timeout: ~6 min locally, so roughly 20-25 min on a hosted runner.
  halmos-planner:
    name: Contracts (Halmos planner and execution checks)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Halmos
        run: uv tool install --python 3.12 halmos==0.3.3

      # Non-blocking for the same reason as the router checks. A TIMEOUT is not
      # a proof either, so it fails the step like the incomplete-run warnings.
      - name: Halmos (planner and execution)
        continue-on-error: true
        env:
          FOUNDRY_PROFILE: halmos
        run: |
          set -o pipefail
          halmos --function 'check_(sort_|waterfall_|proRataMin_|execute_[123]\()' 2>&1 | tee halmos.log
          if grep -E 'warnings#(loop-bound|counterexample-unknown|revert-all|internal-error)|\[TIMEOUT\]' halmos.log; then
            echo "::error::Halmos run is not a complete proof (see above)"
            exit 1
          fi

  sdk:
    name: SDK (typecheck / lint / format)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/typescript/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and check formatting
        run: pnpm check

  sdk-rust:
    name: SDK Rust (build / clippy / format)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: sdk/rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contract ABI artifact
        working-directory: .
        run: forge build src/PropAMMRouter.sol

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        env:
          REQUIRE_CONTRACT_ABI: "1"
          REQUIRE_CONTRACT_SRC: "1"
        run: cargo test

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sdk/docs

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/docs/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  sdk-python:
    name: SDK Python (lint / format / tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sdk/python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contract ABI artifact
        working-directory: .
        run: forge build src/PropAMMRouter.sol

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest
